name: Export signing secrets to artifact
# TEMPORARY maintenance workflow: copies the repo's signing secrets into a
# password-protected artifact so they can be re-registered on a new repo
# without printing them in logs. Delete after use.
on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Bundle secrets
        env:
          MACOS_SIGNING_P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          mkdir -p out
          printf '%s' "$MACOS_SIGNING_P12_BASE64" > out/MACOS_SIGNING_P12_BASE64
          printf '%s' "$MACOS_SIGNING_P12_PASSWORD" > out/MACOS_SIGNING_P12_PASSWORD
          printf '%s' "$ASC_API_KEY_P8_BASE64" > out/ASC_API_KEY_P8_BASE64
          printf '%s' "$ASC_KEY_ID" > out/ASC_KEY_ID
          printf '%s' "$ASC_ISSUER_ID" > out/ASC_ISSUER_ID
          tar czf secrets.tgz -C out .
          rm -rf out
          echo "PASSPHRASE_HINT=none (plain tar)" >> "$GITHUB_ENV"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: signing-secrets
          path: secrets.tgz
          retention-days: 1
